name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The acceptance report (e2e/report) used to be built here from two runs of every suite. Its checklist
# (e2e/report/acceptance.json) is the 16 items of the conversation work whose specs (chat perf, scroll, cards, ...) were
# removed with the Room workbench, so the report could never pass: it listed those items "not covered", wanted their
# measurements, and its secret scan read a spec that no longer exists. The jobs below run each suite once and upload the
# Playwright reports. (Only e2e/licenses.spec.ts still carries an @acc tag.)
jobs:
  # The acceptance suite against the running stack in mock model mode:
  # PostgreSQL (a container, with the control roles and migrations) + Temporal dev server + orbit-control + orbit-orch +
  # orbit-worker (ORBIT_MODEL_MODE=mock) + orbit-web production build. E1–E7 (13 §2) run on it.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A standalone checkout has no sibling submodules, so up.mjs clones these refs. They are the commits that
      # orbit-infra pins for orbit-control and orbit-runtime, so the stack under test is the one that gets deployed.
      # Update both together with the orbit-infra pin (`git -C orbit-infra ls-tree HEAD orbit-control orbit-runtime`);
      # when a batch moves the pin, the refs move in the same commit.
      ORBIT_CONTROL_REF: d15e908653ac87054ffc9ac24d652aa2e4be9236
      ORBIT_RUNTIME_REF: 638af3f90b38193be6d164056961a9f6a1a35c6b
      # Keep the stack's files (bin, logs, stack.json, tool log) in the workspace, where the steps below collect them.
      # Without this, up.mjs would use the parent of the checkout. The two clones live in the runner's temp directory;
      # the `runner` context is not available in a job-level `env`, so the first step exports their paths.
      ORBIT_STACK_DIR: ${{ github.workspace }}/.stack
    steps:
      - name: Put the orbit-control and orbit-runtime clones outside the workspace
        run: |
          echo "ORBIT_CONTROL_DIR=$RUNNER_TEMP/orbit-control" >> "$GITHUB_ENV"
          echo "ORBIT_RUNTIME_DIR=$RUNNER_TEMP/orbit-runtime" >> "$GITHUB_ENV"

      # The PR head, not the merge commit, so the report names the commit under review.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # orbit-control's go.mod says `go 1.25.0`.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Starts a fresh stack (e2e/stack/up.mjs, orbit-control and orbit-runtime at the orbit-infra pins) and runs e2e/stack.
      - run: pnpm test:stack

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-logs
          path: |
            .stack/logs
            test-results-stack
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-stack
          path: playwright-report-stack
          retention-days: 14

  # What the mock model cannot produce on demand, against a scripted control; plus the licence check.
  scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # No browser, no stack: type check, lint and the unit tests of the pure logic in src/lib (17 G12).
  # The coverage run fails when the covered lib files drop under the thresholds in vitest.config.ts.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:coverage
