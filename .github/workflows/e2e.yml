name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job runs its suite twice on the same commit: the first run writes acceptance-report/, the rerun
# acceptance-report/rerun/ (runs/<run>.json plus screenshots). The last job builds both reports, checks that their
# report.json files are byte-identical and that the measured numbers meet the thresholds in both runs, secret-scans
# everything, and uploads it as `acceptance-report`.
jobs:
  # The acceptance suite against the running stack in mock model mode:
  # Temporal dev server + orbit-control + orbit-orch + orbit-worker (ORBIT_MODEL_MODE=mock) + orbit-web production build.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The PR head, not the merge commit, so the report names the commit under review.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      # Starts a fresh stack (e2e/stack/up.mjs, pinned orbit-control and orbit-runtime refs) and runs e2e/stack.
      - run: pnpm test:stack

      - if: success() || failure()
        run: cp .stack/stack.json acceptance-report/stack.json || true

      - name: Rerun on the same commit
        if: success() || failure()
        run: pnpm test:stack
        env:
          ACCEPTANCE_OUT: acceptance-report/rerun

      - if: success() || failure()
        run: cp .stack/stack.json acceptance-report/rerun/stack.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-run-stack
          path: acceptance-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-logs
          path: |
            .stack/logs
            test-results-stack
          retention-days: 7

  # What the mock model cannot produce on demand, against a scripted control; plus the licence check.
  scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm test:e2e

      - name: Rerun on the same commit
        if: success() || failure()
        run: pnpm test:e2e --output test-results-rerun
        env:
          ACCEPTANCE_OUT: acceptance-report/rerun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-run-scripted
          path: acceptance-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # 1000 messages + one 50,000-character reply on the production build; initial bundle size.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm perf:chat

      # The Chrome trace of the first run (open in DevTools > Performance) is large, so it travels separately.
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: chat-perf-trace
          path: perf-results
          retention-days: 14

      - name: Rerun on the same commit
        if: success() || failure()
        run: pnpm perf:chat
        env:
          ACCEPTANCE_OUT: acceptance-report/rerun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-run-fixture-perf
          path: acceptance-report
          retention-days: 14

  acceptance-report:
    needs: [stack, scripted, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-run-*
          path: acceptance-report
          merge-multiple: true

      - name: Build the report of each run
        run: |
          node e2e/report/build.mjs acceptance-report
          node e2e/report/build.mjs acceptance-report/rerun

      - name: Compare the two runs
        if: success() || failure()
        run: node e2e/report/compare.mjs acceptance-report acceptance-report/rerun

      - name: Install gitleaks 8.30.1 (pinned checksum)
        if: success() || failure()
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Secret-scan the report
        if: success() || failure()
        run: node e2e/report/scan.mjs acceptance-report
        env:
          GITLEAKS: /tmp/gitleaks
          REQUIRE_GITLEAKS: "1"

      - if: always()
        run: |
          cat acceptance-report/index.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Rerun comparison' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./acceptance-report/rerun-comparison.json");console.log(JSON.stringify({commit:r.commit,reportJson:{identical:r.reportJson.identical,sha256:r.reportJson.sha256},pass:r.pass},null,2))' >> "$GITHUB_STEP_SUMMARY" || true
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          echo '## Secret scan' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const s=require("./acceptance-report/secret-scan.json");console.log(JSON.stringify({scanned:s.scanned,rules:s.rules,findings:s.findings.length,gitleaks:{version:s.gitleaks.version,findings:s.gitleaks.findings},pass:s.pass},null,2))' >> "$GITHUB_STEP_SUMMARY" || true
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: acceptance-report
          if-no-files-found: error
          retention-days: 30
