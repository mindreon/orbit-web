name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job runs its suite twice on the same commit: the first run writes acceptance-report/, the rerun
# acceptance-report/rerun/ (runs/<run>.json plus screenshots). The last job builds both reports, checks that their
# report.json files are byte-identical and that the measured numbers meet the thresholds in both runs, secret-scans
# everything, and uploads it as `acceptance-report`.
jobs:
  # The acceptance suite against the running stack in mock model mode:
  # PostgreSQL (a container, with the control roles and migrations) + Temporal dev server + orbit-control + orbit-orch +
  # orbit-worker (ORBIT_MODEL_MODE=mock) + orbit-web production build. E1–E7 (13 §2) run on it.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A standalone checkout has no sibling submodules, so up.mjs clones these refs. They are the commits that
      # orbit-infra pins for orbit-control and orbit-runtime, so the stack under test is the one that gets deployed.
      # Update both together with the orbit-infra pin (`git -C orbit-infra ls-tree HEAD orbit-control orbit-runtime`).
      ORBIT_CONTROL_REF: 00603f351079d1a770048fbd17d6150f1e022409
      ORBIT_RUNTIME_REF: f41612509e994afc8b706f8f902ad9d3247866e4
      # Keep the stack's files (bin, logs, stack.json, tool log) in the workspace, where the steps below collect them,
      # and the two clones out of it. Without these, up.mjs would use the parent of the checkout.
      ORBIT_STACK_DIR: ${{ github.workspace }}/.stack
      ORBIT_CONTROL_DIR: ${{ runner.temp }}/orbit-control
      ORBIT_RUNTIME_DIR: ${{ runner.temp }}/orbit-runtime
    steps:
      # The PR head, not the merge commit, so the report names the commit under review.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # orbit-control's go.mod says `go 1.25.0`.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Starts a fresh stack (e2e/stack/up.mjs, orbit-control and orbit-runtime at the orbit-infra pins) and runs e2e/stack.
      - run: pnpm test:stack

      - if: success() || failure()
        run: cp .stack/stack.json acceptance-report/stack.json || true

      - name: Rerun on the same commit
        if: success() || failure()
        run: pnpm test:stack
        env:
          ACCEPTANCE_OUT: acceptance-report/rerun

      - if: success() || failure()
        run: cp .stack/stack.json acceptance-report/rerun/stack.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-run-stack
          path: acceptance-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-logs
          path: |
            .stack/logs
            test-results-stack
          retention-days: 7

  # What the mock model cannot produce on demand, against a scripted control; plus the licence check.
  scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Rerun on the same commit
        if: success() || failure()
        run: pnpm test:e2e --output test-results-rerun
        env:
          ACCEPTANCE_OUT: acceptance-report/rerun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-run-scripted
          path: acceptance-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  acceptance-report:
    needs: [stack, scripted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-run-*
          path: acceptance-report
          merge-multiple: true

      - name: Build the report of each run
        run: |
          node e2e/report/build.mjs acceptance-report
          node e2e/report/build.mjs acceptance-report/rerun

      - name: Compare the two runs
        if: success() || failure()
        run: node e2e/report/compare.mjs acceptance-report acceptance-report/rerun

      - name: Install gitleaks 8.30.1 (pinned checksum)
        if: success() || failure()
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Secret-scan the report
        if: success() || failure()
        run: node e2e/report/scan.mjs acceptance-report
        env:
          GITLEAKS: /tmp/gitleaks
          REQUIRE_GITLEAKS: "1"

      - if: always()
        run: |
          cat acceptance-report/index.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Rerun comparison' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./acceptance-report/rerun-comparison.json");console.log(JSON.stringify({commit:r.commit,reportJson:{identical:r.reportJson.identical,sha256:r.reportJson.sha256},pass:r.pass},null,2))' >> "$GITHUB_STEP_SUMMARY" || true
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          echo '## Secret scan' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const s=require("./acceptance-report/secret-scan.json");console.log(JSON.stringify({scanned:s.scanned,rules:s.rules,findings:s.findings.length,gitleaks:{version:s.gitleaks.version,findings:s.gitleaks.findings},pass:s.pass},null,2))' >> "$GITHUB_STEP_SUMMARY" || true
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: acceptance-report
          if-no-files-found: error
          retention-days: 30

  # No browser, no stack: type check, lint and the unit tests of the pure logic in src/lib (17 G12).
  # The coverage run fails when the covered lib files drop under the thresholds in vitest.config.ts.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:coverage
